<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enteral Feeding Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="p-4 md:p-8">

    <!-- ============================================ -->
    <!-- 3. MAIN LAYOUT STRUCTURE                     -->
    <!-- ============================================ -->
    <!-- ADDED ID "calculator-wrapper" TO DETECT RELOADS -->
    <div id="calculator-wrapper" class="max-w-7xl mx-auto">

        <!-- Application Header -->
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Enteral Feeding Calculator</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- LEFT COLUMN: INPUTS & CONTROLS -->
            <div class="lg:col-span-1 space-y-6">

                <!-- Input Section A: Primary Formula Selection -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-gray-700">Formula Selection</h2>
                        
                        <!-- Patient Type Toggle -->
                        <div class="flex bg-gray-100 rounded-lg p-1">
                            <button id="adultBtn" class="px-3 py-1 text-sm font-medium rounded-md bg-white text-gray-800 shadow-sm transition-all">Adult</button>
                            <button id="pediatricBtn" class="px-3 py-1 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition-all">Pediatric</button>
                        </div>
                    </div>
                    <div class="p-4 space-y-4">
                        <div>
                            <label for="formulaInput" class="block text-sm font-medium text-gray-700 mb-1">Select Primary Formula</label>
                            <div class="flex space-x-2" id="formulaSelectContainer">
                                <div class="relative flex-grow">
                                    <input type="text" id="formulaInput" placeholder="Search for a formula..." autocomplete="off" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <div id="formulaDropdown"
                                        class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-300 rounded-lg shadow-lg z-10 max-h-60 overflow-y-auto hidden">
                                        <!-- Results injected via JS -->
                                    </div>
                                </div>
                                <button id="addFormulaBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-opacity-50">
                                    Add
                                </button>
                            </div>
                        </div>
                        <div id="formulaPillsContainer" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Input Section B: Modular Formulas (Accordion) -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <button id="modularHeaderBtnInput" class="w-full p-4 border-b border-gray-200 flex justify-between items-center text-left focus:outline-none">
                        <h2 class="text-xl font-semibold text-gray-700">Modular Formulas</h2>
                        <svg id="modularChevronInput" class="w-5 h-5 text-gray-500 transition-transform" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="modularContainerWrapper" class="hidden">
                        <div class="p-4 space-y-3 border-b border-gray-200">
                            <label for="modularSelect" class="block text-sm font-medium text-gray-700 mb-1">Select Modular Formula</label>
                            <div class="flex space-x-2" id="modularSelectContainer">
                                <select id="modularSelect" class="flex-grow w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">-- Select a modular --</option>
                                </select>
                                <button id="addModularBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-opacity-50">
                                    Add
                                </button>
                            </div>
                        </div>
                        <div id="modularContainer" class="p-4 space-y-3 max-h-60 overflow-y-auto"></div>
                    </div>
                </div>

                <!-- Input Section C: Client Needs -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <div class="p-4 border-b border-gray-200">
                        <h2 class="text-xl font-semibold text-gray-700">Client Needs</h2>
                    </div>
                    <div class="p-4 space-y-4">
                        <div>
                            <label for="energyNeeds" class="block text-sm font-medium text-gray-700 mb-1">Energy Needs (Kcal)</label>
                            <input type="number" id="energyNeeds" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="proteinNeeds" class="block text-sm font-medium text-gray-700 mb-1">Protein Needs (g)</label>
                            <input type="number" id="proteinNeeds" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="fluidNeeds" class="block text-sm font-medium text-gray-700 mb-1">Fluid Needs (mL)</label>
                            <input type="number" id="fluidNeeds" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Input Section D: Feeding Parameters -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <div class="p-4 border-b border-gray-200">
                        <h2 class="text-xl font-semibold text-gray-700">Feeding Parameters</h2>
                    </div>
                    <div class="p-4 space-y-4">
                        <div>
                            <label for="feedingGoalSlider" class="block text-sm font-medium text-gray-700 mb-1">Feeding Goal: <span id="feedingGoalValue" class="font-bold text-blue-600">100%</span></label>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-gray-500">1%</span>
                                <input type="range" id="feedingGoalSlider" min="1" max="100" value="100" class="w-full">
                                <span class="text-sm text-gray-500">100%</span>
                            </div>
                        </div>
                        <div>
                            <label for="feedingPeriod" class="block text-sm font-medium text-gray-700 mb-1">Feeding Period (hrs/day)</label>
                            <select id="feedingPeriod" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <option value="24">For 24 hours</option>
                                <option value="23">For 23 hours</option>
                                <option value="22">For 22 hours</option>
                                <option value="21">For 21 hours</option>
                                <option value="20">For 20 hours</option>
                                <option value="18">For 18 hours</option>
                                <option value="16">For 16 hours</option>
                                <option value="12">For 12 hours</option>
                                <option value="8">Every 8 hours</option>
                                <option value="6">Every 6 hours</option>
                                <option value="4">Every 4 hours</option>
                                <option value="3">Every 3 hours</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Input Section E: Propofol (Accordion) -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <button id="propofolHeaderBtnInput" class="w-full p-4 border-b border-gray-200 flex justify-between items-center text-left focus:outline-none">
                        <h2 class="text-xl font-semibold text-gray-700">Propofol (1%)</h2>
                        <svg id="propofolChevronInput" class="w-5 h-5 text-gray-500 transition-transform" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="propofolContainerWrapper" class="p-4 space-y-4 hidden">
                        <div>
                            <label for="propofolVolume" class="block text-sm font-medium text-gray-700 mb-1">Volume (mL/hr)</label>
                            <input type="number" id="propofolVolume" placeholder="0" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="propofolDuration" class="block text-sm font-medium text-gray-700 mb-1">Duration (hrs/day)</label>
                            <input type="number" id="propofolDuration" placeholder="0" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Primary Actions -->
                <div class="space-y-3">
                    <button id="calculateBtn" class="w-full px-6 py-3 bg-emerald-600 text-white font-semibold rounded-lg shadow-md hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-opacity-75 text-lg transition-colors duration-200">
                        Calculate
                    </button>
                    <button id="resetBtn" class="w-full px-6 py-2 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">
                        Reset All
                    </button>
                </div>

            </div> <!-- END Left Column -->

            <!-- RIGHT COLUMN: RESULTS DASHBOARD -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Result Section A: Primary Breakdown -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <div class="p-4 border-b border-gray-200">
                        <h2 class="text-xl font-semibold text-gray-700">Primary Formula Breakdown</h2>
                    </div>
                    <div id="primaryBreakdownContainer" class="p-4">
                        <p class="text-gray-500 text-center">Calculations for the primary formula(s) will appear here.
                        </p>
                    </div>
                </div>

                <!-- Result Section B: Propofol Results (Accordion) -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <button id="propofolHeaderBtn" class="w-full p-4 border-b border-gray-200 flex justify-between items-center text-left focus:outline-none">
                        <h2 class="text-xl font-semibold text-gray-700">Propofol (1%)</h2>
                        <svg id="propofolChevron" class="w-5 h-5 text-gray-500 transition-transform" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="propofolBreakdownContainer" class="p-4 hidden">
                        <p class="text-gray-500 text-center">Propofol calculations will appear here.</p>
                    </div>
                </div>

                <!-- Result Section C: Modular Results (Accordion) -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                    <button id="modularHeaderBtn" class="w-full p-4 border-b border-gray-200 flex justify-between items-center text-left focus:outline-none">
                        <h2 class="text-xl font-semibold text-gray-700">Modular Breakdown</h2>
                        <svg id="modularChevron" class="w-5 h-5 text-gray-500 transition-transform" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="modularBreakdownContainer" class="p-4 hidden">
                        <p class="text-gray-500 text-center">Modular formula calculations will appear here.</p>
                    </div>
                </div>
            </div> <!-- END Right Column -->

        </div>
    </div>

    <!-- ============================================ -->
    <!-- 4. APPLICATION LOGIC                         -->
    <!-- ============================================ -->
    <script src="script.js"></script>

</body>

</html>
